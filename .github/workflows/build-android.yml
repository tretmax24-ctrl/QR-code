name: Build QR Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - script.js
      - style.css
      - manifest.webmanifest
      - icon.svg
      - .github/workflows/build-android.yml

permissions:
  contents: read

env:
  APP_URL: https://tretmax24-ctrl.github.io/QR-code/
  MANIFEST_URL: https://tretmax24-ctrl.github.io/QR-code/manifest.webmanifest

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Wait for live PWA manifest
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$MANIFEST_URL" | grep -q 'QR Studio'; then
              exit 0
            fi
            sleep 10
          done
          echo "The GitHub Pages manifest was not available in time."
          exit 1

      - name: Create Android project
        run: |
          mkdir -p android
          bubblewrap init \
            --manifest "$MANIFEST_URL" \
            --directory android \
            --no-prompt \
            --packageId com.tretmax24.qrstudio \
            --name "QR Studio" \
            --shortName "QR Studio" \
            --launcherName "QR Studio" \
            --startUrl "./" \
            --display standalone

      - name: Build signed APK
        working-directory: android
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-android
          path: |
            android/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
